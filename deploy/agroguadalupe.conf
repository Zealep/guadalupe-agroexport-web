# Nginx: web de agroguadalupe.com
# Se instala en /etc/nginx/sites-available/agroguadalupe.conf (lo hace preparar-servidor.sh).
# El HTTPS lo añade certbot automáticamente a este mismo archivo.

# www.agroguadalupe.com -> agroguadalupe.com
server {
    listen 80;
    listen [::]:80;
    server_name www.agroguadalupe.com;
    return 301 $scheme://agroguadalupe.com$request_uri;
}

server {
    # default_server: también responde si se entra por la IP del droplet
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name agroguadalupe.com;

    # "current" es un enlace a la última versión publicada (ver publicar.sh)
    root /var/www/agroguadalupe/current;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # --- Direcciones de la web anterior (WordPress) -> nuevas ---
    location ~ ^/productoscb/?$             { return 301 /productos/; }
    location ~ ^/en/productscb/?$           { return 301 /en/products/; }
    location ~ ^/en/home/?$                 { return 301 /en/; }
    location ~ ^/en/productos/paprika-2/?$  { return 301 /en/products/paprika/; }
    location ~ ^/en/productos/([^/]+)/?$    { return 301 /en/products/$1/; }
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json) { return 301 /; }

    # Archivos con nombre único generados por Astro: caché de 1 año
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
